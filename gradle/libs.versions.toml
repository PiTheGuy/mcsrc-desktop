[versions]
jcef = "146.0.10-jcefgithub.9"
vineflower = "1.12.0"
gson = "2.10.1"
guava = "33.6.0-jre"
mcsrc = "0.4.1"
jopt = "5.0.4"
log4j = "2.26.1"
lwjgl = "3.4.3"

[libraries]
jcef = {module = "io.github.trethore:jcefgithub", version.ref = "jcef"}
vineflower = {module = "org.vineflower:vineflower", version.ref = "vineflower"}
gson = {module = "com.google.code.gson:gson", version.ref = "gson"}
guava = {module = "com.google.guava:guava", version.ref = "guava"}
mcsrc = {module = "dev.mcsrc:core", version.ref = "mcsrc"}
jopt = {module = "net.sf.jopt-simple:jopt-simple", version.ref = "jopt"}
log4j = {module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j"}
lwjgl = {module = "org.lwjgl:lwjgl", version.ref = "lwjgl"}
nfd = {module = "org.lwjgl:lwjgl-nfd", version.ref = "lwjgl"}

[bundles]
lwjgl = ["lwjgl", "nfd"]